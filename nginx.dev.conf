server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index login.html;

    # PDF uploads are up to 25MB; give the proxy headroom.
    client_max_body_size 30M;

    # Development container — files change constantly while iterating,
    # so never let the browser cache a stale page between edits.
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    expires -1;

    # Same-origin API — the frontend calls /api (see js/config/env.js) and
    # nginx forwards it to the backend container, so dev mirrors production
    # and no CORS is involved.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # AI calls can take a while
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
