# =============================================================================
# LexAssist AI — PRODUCTION compose (Ubuntu VPS)
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Differences from the dev compose:
#   - nginx terminates HTTPS, serves the frontend, and proxies /api → backend
#   - backend and mongo ports are NOT published to the host (internal only)
#   - no source bind-mounts for the backend (code is baked into the image)
#   - restart: always; healthchecks gate startup order
# Requires a populated .env in this directory (see .env.example).
# =============================================================================

services:
  frontend:
    image: nginx:alpine
    container_name: lexassist-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/login.html"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mongo:
    image: mongo:7
    container_name: lexassist-mongo
    restart: always
    # No host port — only the backend (same network) reaches Mongo.
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build: ./backend
    image: lexassist-backend:latest
    container_name: lexassist-backend
    restart: always
    # No host port — reached only via nginx at http://backend:8000.
    env_file: .env
    volumes:
      - backend_uploads:/app/storage/uploads
      - backend_avatars:/app/storage/avatars
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
  backend_uploads:
  backend_avatars:
