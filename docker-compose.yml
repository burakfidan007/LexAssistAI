services:
  frontend:
    image: nginx:alpine
    container_name: lexassist-frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget resolves localhost to IPv6
      # ::1 first, but nginx listens on IPv4 0.0.0.0:80 → connection refused.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/login.html"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mongo:
    image: mongo:7
    container_name: lexassist-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      # 'ping' is allowed pre-auth, so no credentials are needed here.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build: ./backend
    container_name: lexassist-backend
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - backend_uploads:/app/storage/uploads
      - backend_avatars:/app/storage/avatars
    depends_on:
      # Wait until Mongo actually accepts connections, not just until its
      # container has started — otherwise the backend can race index
      # creation / first queries against an unready DB.
      mongo:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  mongo_data:
  backend_uploads:
  backend_avatars:
